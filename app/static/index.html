<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>Sai CareerOS</title><link rel="manifest" href="/static/manifest.json"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f4f7fb}.wrap{max-width:1100px;margin:auto;padding:24px 16px 90px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px}.eyebrow{color:#8fa3bf;font-size:12px;text-transform:uppercase;letter-spacing:.14em}h1{font-size:38px;margin:5px 0}.sub,.muted{color:#94a0af}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:22px 0}.metric,.card{background:#101620;border:1px solid #212a38;border-radius:20px;padding:16px}.metric strong{font-size:28px;display:block}.metric span{font-size:12px;color:#91a0b3}.tabs{display:flex;gap:8px;overflow:auto;padding:7px 0 14px;position:sticky;top:0;background:#07090ddd;backdrop-filter:blur(12px);z-index:5}.tabs button,.btn{border:0;background:#17202d;color:white;border-radius:12px;padding:11px 14px;font-weight:650;text-decoration:none;cursor:pointer}.tabs button.active,.primary{background:#f4f7fb!important;color:#07090d!important}.approve{background:#177e4b!important}.reject{background:#7d2d35!important}.job{margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px}.score{font-size:31px;font-weight:800}.pill{display:inline-block;padding:5px 8px;margin:2px;border-radius:999px;background:#1c2634;font-size:11px}.risk{color:#ffbd69}.hidden{display:none}input,textarea,select{width:100%;background:#0a0f17;border:1px solid #2a3444;color:white;border-radius:12px;padding:11px;margin:5px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.skill{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #202938;padding:10px 0}.empty{padding:24px;text-align:center;color:#8290a2}@media(max-width:780px){.grid{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:14px;width:100%}}
</style></head><body><div class="wrap"><div class="hero"><div><div class="eyebrow">AI career operating system</div><h1>Sai CareerOS</h1><div class="sub">Discover → research → rank → tailor → network → apply → interview → learn</div></div><button class="btn primary" onclick="runAgent()">Run full pipeline</button></div>
<div id="metrics" class="grid"></div><div class="tabs"><button class="active" onclick="tab('jobs',this)">Opportunities</button><button onclick="tab('skills',this)">Skills</button><button onclick="tab('network',this)">Network</button><button onclick="tab('analytics',this)">Analytics</button><button onclick="tab('add',this)">Add JD</button></div>
<section id="jobs"></section><section id="skills" class="hidden"></section><section id="network" class="hidden"></section><section id="analytics" class="hidden"></section><section id="add" class="hidden"><div class="card"><h2>Add job description</h2><input id="title" placeholder="Job title"><input id="company" placeholder="Company"><input id="location" placeholder="Location"><input id="url" placeholder="Apply URL"><textarea id="description" rows="10" placeholder="Paste job description"></textarea><button class="btn primary" onclick="addJob()">Analyze & prepare</button></div></section></div>
<script>
let DATA={};const api=async(u,o={})=>{let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tab(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function render(){let f=DATA.funnel||{};metrics.innerHTML=[['Prepared',f.prepared||0],['Applied',f.applications||0],['Replies',f.replies||0],['Screens',f.screens||0],['Interviews',f.interviews||0],['Offers',f.offers||0]].map(x=>`<div class=metric><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');
let js=DATA.jobs||[];jobs.innerHTML=js.length?js.map(j=>`<div class="card job"><div class=row><div><div class=muted>${esc(j.company)} • ${esc(j.location)}</div><h2>${esc(j.title)}</h2></div><div><div class=score>${j.opportunity_score||j.match_score||0}</div><div class=muted>priority</div></div></div><span class=pill>Fit ${j.match_score||0}</span><span class=pill>Company ${j.company_score||0}</span><span class=pill>Network ${j.network_score||0}</span><span class=pill>Salary ${j.salary_score||0}</span><span class="pill ${j.scam_risk>40?'risk':''}">Scam ${j.scam_risk||0}</span><span class="pill ${j.ghost_risk>40?'risk':''}">Ghost ${j.ghost_risk||0}</span><span class=pill>${esc(j.sponsorship_risk||'visa unknown')}</span><span class=pill>${esc(j.status)}</span><p>${esc(j.score_reason||'Awaiting analysis')}</p>${j.application_id?`<div class=actions><a class=btn href="/api/file/${j.application_id}/resume">Resume ${esc(j.variant)}</a><a class=btn href="/api/file/${j.application_id}/cover">Cover letter</a>${j.approval_status==='PENDING'?`<button class="btn approve" onclick="approve(${j.application_id})">Approve</button><button class="btn reject" onclick="rejectA(${j.application_id})">Reject</button>`:''}<button class=btn onclick="interview(${j.application_id})">Interview prep</button></div><details><summary>Outreach draft</summary><p>${esc(j.outreach_draft)}</p></details>`:''}${j.url?`<div class=actions><a class=btn target=_blank href="${esc(j.url)}">Open posting</a></div>`:''}</div>`).join(''):'<div class="card empty">No jobs yet. Add a JD or connect the live job feed.</div>';
let ss=DATA.skills||[];skills.innerHTML=`<div class=card><div class=row><h2>Market skill intelligence</h2><button class=btn onclick="skillsRefresh()">Refresh</button></div>${ss.length?ss.map(s=>`<div class=skill><div><b>${esc(s.skill)}</b><div class=muted>${s.candidate_has?'Already evidenced':'Gap'} • ${s.mentions} mentions</div></div><div><b>ROI ${Math.round(s.roi_score||0)}</b>${!s.candidate_has?`<br><button class=btn onclick="portfolio('${esc(s.skill)}')">Build project</button>`:''}</div></div>`).join(''):'<p class=muted>Run skill intelligence after collecting several target job descriptions.</p>'}</div>`;
let cs=DATA.contacts||[];network.innerHTML=`<div class=two><div class=card><h2>Relationship CRM</h2>${cs.length?cs.map(c=>`<div class=skill><div><b>${esc(c.name||'Unnamed contact')}</b><div class=muted>${esc(c.company)} • ${esc(c.title)} • ${esc(c.relationship)}</div></div><div><b>${c.warmth_score}</b></div></div>`).join(''):'<p class=muted>No contacts yet.</p>'}</div><div class=card><h2>Warm-path ranking</h2><p>Prior recruiter / first-degree / former colleague → alumni → mutual → cold.</p><p class=muted>Networking strength automatically changes each job's opportunity score.</p></div></div>`;
let v=DATA.variants||{};analytics.innerHTML=`<div class=two><div class=card><h2>Resume A/B testing</h2>${Object.keys(v).length?Object.keys(v).map(k=>`<p><b>Variant ${k}</b> — ${v[k].reply_rate}% reply • ${v[k].interview_rate}% interview</p>`).join(''):'<p class=muted>Conversion data appears after applications begin.</p>'}</div><div class=card><h2>Closed-loop learning</h2><p class=muted>Reply, screen, interview, offer and rejection outcomes feed back into resume variants, job priority, networking strategy and skills ROI.</p></div></div>`}
async function load(){DATA=await api('/api/dashboard');render()}async function runAgent(){await api('/api/run',{method:'POST'});await load()}async function approve(id){await api(`/api/applications/${id}/approve`,{method:'POST'});load()}async function rejectA(id){await api(`/api/applications/${id}/reject`,{method:'POST'});load()}async function interview(id){let p=await api(`/api/interviews/${id}/prepare`,{method:'POST'});alert('Interview packet generated.\n\n60-second intro:\n'+p.intro_60s)}async function skillsRefresh(){await api('/api/skills/refresh',{method:'POST'});load()}async function portfolio(skill){let p=await api('/api/portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill})});alert('Portfolio project:\n'+p.title+'\n\n'+p.brief)}async function addJob(){let b={title:title.value,company:company.value,location:location.value,url:url.value,description:description.value};await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});await api('/api/score',{method:'POST'});await api('/api/prepare',{method:'POST'});load()}load();
</script></body></html>
